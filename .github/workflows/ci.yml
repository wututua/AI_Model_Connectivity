name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  test-installer:
    uses: ./.github/workflows/installer-check.yml

  test-backend:
    name: Go test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v -race ./...

      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test-frontend:
    name: Frontend test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=low

      - name: TypeScript check and build
        working-directory: frontend
        run: npm run build

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
          BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/browser-artifacts
        run: npm run test:browser

      - name: Monitoring center browser tests
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:monitoring

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-browser-failure
          path: ${{ runner.temp }}/browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
