name: Build release binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-installer:
    uses: ./.github/workflows/installer-check.yml

  test-backend:
    name: Test Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Unit tests
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Go vulnerability scan
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

      - name: Test
        run: npm test --prefix frontend

      - name: Dependency audit
        run: npm audit --prefix frontend --audit-level=low

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:browser

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [build-frontend, test-backend, test-installer]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          binary="model-connectivity${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" -o "dist/${binary}" ./cmd/cg

      - name: Package
        run: |
          cd dist
          asset="model-connectivity-${{ matrix.goos }}-${{ matrix.goarch }}"
          cp ../README.md README.md
          cp ../CONTRIBUTING.md ../SECURITY.md ../CHANGELOG.md .
          cp ../install-model-connectivity.sh .
          cp ../LICENSE LICENSE
          cp -r ../docs docs
          cp -r ../assets assets
          cp -r ../web web
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${asset}.zip" "model-connectivity.exe" "README.md" "CONTRIBUTING.md" "SECURITY.md" "CHANGELOG.md" "LICENSE" "install-model-connectivity.sh" "docs/" "assets/" "web/"
          else
            tar -czf "${asset}.tar.gz" "model-connectivity" "README.md" "CONTRIBUTING.md" "SECURITY.md" "CHANGELOG.md" "LICENSE" "install-model-connectivity.sh" "docs/" "assets/" "web/"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-connectivity-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'model-connectivity-*'
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          cp ../install-model-connectivity.sh .
          sha256sum *.zip *.tar.gz install-model-connectivity.sh > SHA256SUMS.txt

      - name: Select versioned release notes
        id: release-notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            printf 'path=%s\n' "$notes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body_path: ${{ steps.release-notes.outputs.path }}
          body: |
            ## 中文

            ### 发布说明

            - 下载与操作系统和架构相匹配的压缩包。
            - 完整解压后可直接使用，内含可执行文件、README、贡献与安全指南、更新日志、许可证、`docs/`、`assets/` 和预构建的 `web/`。
            - 启动后可在管理面板添加 Provider；使用 `--version` 查看构建信息。
            - 使用 `SHA256SUMS.txt` 校验下载文件。
            - 检测会真实调用模型接口并消耗 token，建议适当延长自动检测间隔。

            ### 启动方式

            - 二进制包：在解压目录中运行 `model-connectivity` 或 `model-connectivity.exe`。
            - 源码运行：`go run ./cmd/cg`。
            - Docker：`docker compose up -d`。

            ---

            ## English

            ### Release Notes

            - Download the archive matching your operating system and architecture.
            - Extract the complete archive to get the executable, README, contribution and security guides, changelog, license, `docs/`, `assets/`, and prebuilt `web/`.
            - Start the service and add providers in the admin panel; use `--version` to inspect build information.
            - Verify downloaded files against `SHA256SUMS.txt`.
            - Checks make real model API requests and consume tokens. Consider a longer automatic check interval.

            ### Startup

            - Binary archive: run `model-connectivity` or `model-connectivity.exe` from the extracted directory.
            - From source: `go run ./cmd/cg`.
            - Docker: `docker compose up -d`.
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/install-model-connectivity.sh

  docker:
    name: Push Docker image to Docker Hub
    needs: [build-frontend, test-backend, test-installer]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/model-connectivity
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
