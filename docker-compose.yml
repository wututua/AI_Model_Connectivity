services:
  model-connectivity:
    build: .
    # GitHub Actions 会将预构建镜像发布到 Docker Hub；用户名由仓库 Secret 决定：
    # image: <dockerhub-username>/model-connectivity:latest
    container_name: model-connectivity
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data      # SQLite 数据库持久化
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内必须监听 0.0.0.0 才能接收外部流量
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - ADMIN_TOKEN=${ADMIN_TOKEN:?Set ADMIN_TOKEN to a secret of at least 16 characters}
    healthcheck:
      test: ["CMD", "/model-connectivity", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
