<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模型连通性</title>
    <link
      rel="preload"
      href="/fonts/harmonyos-sans/HarmonyOS_Sans_SC_Regular.ttf?v=297b088424be212207df2ce8b98e335468b782aa6b96832af0b8b773d711e2b1"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>
  <body>
    <script>
      (function(){
        var t = 'dark';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark' || stored === 'light' || stored === 'auto') t = stored;
        } catch (_) {}
        if (t === 'auto') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.body.setAttribute('data-theme', t);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
